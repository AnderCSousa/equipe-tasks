<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Equipe Tasks" />
  <meta name="description" content="Gerenciador de tarefas da equipe em tempo real" />
  <title>Equipe Tasks</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="login-bg"></div>
    <div class="login-box">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="12" fill="white" fill-opacity="0.15"/>
          <path d="M10 28L20 12L30 28H10Z" fill="white" fill-opacity="0.9"/>
          <circle cx="20" cy="20" r="4" fill="white"/>
        </svg>
      </div>
      <h1 class="login-title">Equipe Tasks</h1>
      <p class="login-sub">Quem é você?</p>
      <div id="member-list" class="member-list"></div>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="screen-app" class="screen">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div id="hdr-avatar" class="avatar-lg"></div>
          <div>
            <div id="hdr-name" class="hdr-name"></div>
            <div class="hdr-live"><span class="live-dot"></span><span id="hdr-online">conectando...</span></div>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Trocar usuário">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="tasks" onclick="switchTab('tasks')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tarefas
      </button>
      <button class="tab" data-tab="team" onclick="switchTab('team')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Equipe
      </button>
      <button class="tab" data-tab="summary" onclick="switchTab('summary')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Resumo
      </button>
    </nav>

    <!-- Conteúdo -->
    <main id="main-content" class="main-content"></main>

    <!-- FAB -->
    <button id="fab" class="fab" onclick="openModal()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova tarefa
    </button>
  </div>

  <!-- MODAL NOVA TAREFA -->
  <div id="modal" class="modal-overlay hidden" onclick="closeModalOutside(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Nova tarefa</h2>

      <label class="field-label">Título da tarefa</label>
      <input id="inp-title" type="text" class="field-input" placeholder="Descreva o que precisa ser feito..." />

      <label class="field-label">Prioridade</label>
      <div class="priority-row">
        <button class="prio-btn" id="pb-urgente" onclick="setPrio('urgente')">🔴 Urgente</button>
        <button class="prio-btn active-normal" id="pb-normal" onclick="setPrio('normal')">🔵 Normal</button>
        <button class="prio-btn" id="pb-baixa" onclick="setPrio('baixa')">🟢 Baixa</button>
      </div>

      <label class="field-label">Atribuir para</label>
      <div id="assign-grid" class="assign-grid"></div>

      <label class="field-label">Prazo</label>
      <input id="inp-due" type="date" class="field-input" />

      <div class="modal-actions">
        <button class="btn-sec" onclick="closeModal()">Cancelar</button>
        <button class="btn-prim" onclick="createTask()">Criar tarefa</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
